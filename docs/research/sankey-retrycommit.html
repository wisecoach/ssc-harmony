<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8">
<title>Sankey - RetryCommit 完整三阶段</title>
<style>
  body{background:#020617;display:flex;justify-content:center;font-family:system-ui,sans-serif;margin:20px}
  svg{background:#020617;max-width:1300px}
  text{font-family:system-ui,'Segoe UI',sans-serif}
</style>
</head>
<body>
<svg viewBox="0 0 1300 1100" width="1300" height="1100">
<defs>
  <marker id="arw" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#475569"/></marker>
  <marker id="arw-g" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#34d399"/></marker>
  <marker id="arw-r" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#fb7185"/></marker>
  <marker id="arw-y" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#fbbf24"/></marker>
</defs>
<rect width="1300" height="1100" fill="#020617"/>

<text x="650" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#f1f5f9">RetryCommit 完整三阶段 + 跨分片聚合</text>
<text x="650" y="50" text-anchor="middle" font-size="11" fill="#64748b">2026-07-09 实验 | 上图 = per-shard 聚合 | 下图 = per-tx 唯一交易</text>

<!-- ===== 配色体系 ===== -->
<!-- Phase1/锁: #22d3ee (cyan)    Phase2/检测: #f87171 (red)    Phase2b/Patch: #a78bfa (purple)    成功: #34d399 (green)   失败: #fb7185 (pink)    等待: #fbbf24 (yellow) -->

<!-- ===================================================== -->
<!-- 上半部分：Per-Shard 视角 -->
<!-- ===================================================== -->

<rect x="10" y="70" width="1260" height="490" rx="8" fill="rgba(30,41,59,0.3)" stroke="#475569" stroke-width="1"/>
<text x="30" y="92" font-size="13" font-weight="700" fill="#94a3b8">Per-Shard 聚合 (44,786 HandleRetrySignal / 4 shards ≈ 11,197 per shard)</text>

<!-- 入囗 -->
<rect x="50" y="110" width="140" height="55" rx="6" fill="rgba(99,102,241,0.3)" stroke="#818cf8" stroke-width="2"/>
<text x="120" y="132" text-anchor="middle" font-size="11" fill="#818cf8" font-weight="600">HandleRetrySignal</text>
<text x="120" y="149" text-anchor="middle" font-size="14" fill="#f1f5f9">44,786</text>

<!-- ===== Phase 1 ===== -->
<line x1="190" y1="137" x2="240" y2="137" stroke="#475569" stroke-width="2" marker-end="url(#arw)"/>

<rect x="250" y="100" width="160" height="75" rx="6" fill="rgba(34,211,238,0.15)" stroke="#22d3ee" stroke-width="2"/>
<text x="330" y="120" text-anchor="middle" font-size="11" fill="#22d3ee" font-weight="600">Phase 1: TryLock</text>
<text x="330" y="135" text-anchor="middle" font-size="10" fill="#94a3b8">TempLockView + Wound-Wait</text>
<line x1="260" y1="148" x2="400" y2="148" stroke="#475569" stroke-width="0.5"/>
<text x="330" y="162" text-anchor="middle" font-size="11" fill="#34d399">成功: 33,966 (75.8%)</text>
<text x="330" y="176" text-anchor="middle" font-size="10" fill="#fb7185">失败(wounded/fail): 10,820</text>

<!-- Phase1 fail → loop back -->
<path d="M410,145 L440,145 L440,80 L250,80 L250,100" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arw-r)"/>
<text x="310" y="75" font-size="9" fill="#fb7185">10,820 回 retry pool (CallForRetry)</text>

<!-- Phase1 success → Phase 2 -->
<line x1="330" y1="175" x2="330" y2="240" stroke="#34d399" stroke-width="2" marker-end="url(#arw-g)"/>

<!-- ===== Phase 2 ===== -->
<rect x="250" y="250" width="160" height="75" rx="6" fill="rgba(251,113,133,0.15)" stroke="#f87171" stroke-width="2"/>
<text x="330" y="270" text-anchor="middle" font-size="11" fill="#f87171" font-weight="600">Phase 2: CheckLock</text>
<text x="330" y="285" text-anchor="middle" font-size="10" fill="#94a3b8">SLM + TLV 双重检测</text>
<line x1="260" y1="298" x2="400" y2="298" stroke="#475569" stroke-width="0.5"/>
<text x="330" y="312" text-anchor="middle" font-size="11" fill="#34d399">无冲突→Locked: 32,762</text>
<text x="330" y="326" text-anchor="middle" font-size="10" fill="#fb7185">有冲突: 1,204</text>

<!-- No conflict → resimulation -->
<line x1="280" y1="325" x2="200" y2="400" stroke="#34d399" stroke-width="2" marker-end="url(#arw-g)"/>
<text x="225" y="370" font-size="10" fill="#34d399">32,762</text>

<!-- Conflict → Phase 2b -->
<line x1="410" y1="290" x2="460" y2="290" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arw-r)"/>

<!-- ===== Phase 2b ===== -->
<rect x="470" y="250" width="160" height="75" rx="6" fill="rgba(167,139,250,0.2)" stroke="#a78bfa" stroke-width="2"/>
<text x="550" y="270" text-anchor="middle" font-size="11" fill="#a78bfa" font-weight="600">Phase 2b: PatchPool</text>
<text x="550" y="285" text-anchor="middle" font-size="10" fill="#94a3b8">FindCoveringSet(DAG)</text>
<line x1="480" y1="298" x2="620" y2="298" stroke="#475569" stroke-width="0.5"/>
<text x="550" y="312" text-anchor="middle" font-size="11" fill="#34d399">DAG 命中→Locked: 372</text>
<text x="550" y="326" text-anchor="middle" font-size="10" fill="#fbbf24">未命中→LockWait: 832</text>

<!-- DAG hit → resimulation -->
<path d="M470,310 L430,310 L430,400 L200,400" stroke="#a78bfa" stroke-width="1.5" fill="none" marker-end="url(#arw-g)"/>
<text x="390" y="390" font-size="10" fill="#a78bfa">372</text>

<!-- LockWait → loop (wait block → recheck) -->
<path d="M550,325 L550,360 L620,360 L620,80 L250,80 L250,100" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5,3" fill="none" marker-end="url(#arw-y)"/>
<text x="570" y="75" font-size="9" fill="#fbbf24">832 LockWait → 出池后重试</text>

<!-- ===== startReSimulation ===== -->
<rect x="50" y="400" width="160" height="70" rx="6" fill="rgba(251,113,133,0.2)" stroke="#fb7185" stroke-width="2"/>
<text x="130" y="420" text-anchor="middle" font-size="11" fill="#fb7185" font-weight="600">startReSimulation</text>
<text x="130" y="437" text-anchor="middle" font-size="10" fill="#94a3b8">33,134 Locked=true</text>
<line x1="60" y1="448" x2="200" y2="448" stroke="#475569" stroke-width="0.5"/>
<text x="130" y="462" text-anchor="middle" font-size="10" fill="#fb7185">失败: 31,502 (95.1%)</text>
<text x="130" y="474" text-anchor="middle" font-size="10" fill="#34d399">成功: 1,632 (4.9%)</text>

<!-- resimulation failed → CallForRetry -->
<path d="M130,470 L130,510 L250,510 L250,80 L250,100" stroke="#fb7185" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arw-r)"/>
<text x="190" y="500" font-size="9" fill="#fb7185">31,502 CallForRetry (simNum+1) → 下一轮 44,786 含这些重试</text>

<!-- resimulation success → commit -->
<line x1="50" y1="440" x2="20" y2="440" stroke="#34d399" stroke-width="2"/>
<text x="30" y="430" font-size="10" fill="#34d399">1,632</text>

<!-- ===================================================== -->
<!-- 下半部分：Per-Tx 唯一交易视角 -->
<!-- ===================================================== -->

<rect x="10" y="580" width="1260" height="490" rx="8" fill="rgba(30,41,59,0.3)" stroke="#475569" stroke-width="1"/>
<text x="30" y="602" font-size="13" font-weight="700" fill="#94a3b8">Per-Tx 唯一交易视角 (约 10,000 笔交易, 平均 3-4 related shard)</text>

<!-- 步骤1: 原始仿真 -->
<rect x="50" y="625" width="130" height="55" rx="6" fill="rgba(99,102,241,0.3)" stroke="#818cf8" stroke-width="2"/>
<text x="115" y="647" text-anchor="middle" font-size="11" fill="#818cf8" font-weight="600">原始仿真</text>
<text x="115" y="663" text-anchor="middle" font-size="14" fill="#f1f5f9">10,000</text>

<!-- 原始成功 → BuildSim -->
<line x1="180" y1="645" x2="230" y2="645" stroke="#34d399" stroke-width="2" marker-end="url(#arw-g)"/>
<rect x="240" y="625" width="130" height="55" rx="6" fill="rgba(52,211,153,0.2)" stroke="#34d399" stroke-width="2"/>
<text x="305" y="647" text-anchor="middle" font-size="11" fill="#34d399" font-weight="600">原始成功</text>
<text x="305" y="663" text-anchor="middle" font-size="13" fill="#f1f5f9">~8,000 (80%)</text>

<!-- 原始失败 → retry -->
<line x1="180" y1="665" x2="230" y2="720" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arw-r)"/>

<rect x="240" y="700" width="130" height="55" rx="6" fill="rgba(251,146,60,0.2)" stroke="#fb923c" stroke-width="2"/>
<text x="305" y="722" text-anchor="middle" font-size="11" fill="#fb923c" font-weight="600">进入 RetryPool</text>
<text x="305" y="738" text-anchor="middle" font-size="13" fill="#f1f5f9">~2,000 (20%)</text>

<!-- BuildSim → 全部 -->
<line x1="370" y1="650" x2="440" y2="650" stroke="#22d3ee" stroke-width="2" marker-end="url(#arw)"/>
<rect x="450" y="620" width="140" height="60" rx="6" fill="rgba(34,211,238,0.2)" stroke="#22d3ee" stroke-width="2"/>
<text x="520" y="642" text-anchor="middle" font-size="11" fill="#22d3ee" font-weight="600">BuildSim</text>
<text x="520" y="659" text-anchor="middle" font-size="14" fill="#f1f5f9">~15,052</text>
<text x="520" y="673" text-anchor="middle" font-size="9" fill="#64748b">(原始8k+重试7k)</text>

<!-- BuildSim → SubmitSimTx -->
<line x1="590" y1="650" x2="660" y2="650" stroke="#fbbf24" stroke-width="2" marker-end="url(#arw-y)"/>
<rect x="670" y="620" width="140" height="60" rx="6" fill="rgba(120,53,15,0.2)" stroke="#fbbf24" stroke-width="2"/>
<text x="740" y="642" text-anchor="middle" font-size="11" fill="#fbbf24" font-weight="600">SubmitSimTx</text>
<text x="740" y="659" text-anchor="middle" font-size="13" fill="#f1f5f9">→onChainPatches</text>

<!-- → VerifySim -->
<line x1="810" y1="650" x2="880" y2="650" stroke="#60a5fa" stroke-width="2" marker-end="url(#arw)"/>
<rect x="890" y="620" width="140" height="60" rx="6" fill="rgba(59,130,246,0.2)" stroke="#60a5fa" stroke-width="2"/>
<text x="960" y="642" text-anchor="middle" font-size="11" fill="#60a5fa" font-weight="600">VerifySimulation</text>
<text x="960" y="659" text-anchor="middle" font-size="14" fill="#f1f5f9">55,193</text>
<text x="960" y="673" text-anchor="middle" font-size="9" fill="#64748b">(~15k×3.7 shard)</text>

<!-- → Close -->
<line x1="1030" y1="650" x2="1080" y2="700" stroke="#22c55e" stroke-width="2" marker-end="url(#arw)"/>
<rect x="1090" y="700" width="140" height="55" rx="6" fill="rgba(34,197,94,0.2)" stroke="#22c55e" stroke-width="2"/>
<text x="1160" y="722" text-anchor="middle" font-size="11" fill="#22c55e" font-weight="600">leader close</text>
<text x="1160" y="739" text-anchor="middle" font-size="14" fill="#f1f5f9">13,399</text>

<!-- Close → Commit/Unfinished -->
<line x1="1160" y1="755" x2="1160" y2="810" stroke="#475569" stroke-width="1.5"/>
<line x1="1160" y1="810" x2="1080" y2="810" stroke="#10b981" stroke-width="2" marker-end="url(#arw)"/>
<line x1="1160" y1="810" x2="1200" y2="860" stroke="#ef4444" stroke-width="2" marker-end="url(#arw)"/>

<rect x="940" y="790" width="130" height="55" rx="6" fill="rgba(16,185,129,0.2)" stroke="#10b981" stroke-width="2"/>
<text x="1005" y="812" text-anchor="middle" font-size="11" fill="#10b981" font-weight="600">Committed</text>
<text x="1005" y="829" text-anchor="middle" font-size="14" fill="#f1f5f9">7,432</text>

<rect x="1205" y="850" width="80" height="55" rx="6" fill="rgba(239,68,68,0.2)" stroke="#ef4444" stroke-width="2"/>
<text x="1245" y="872" text-anchor="middle" font-size="11" fill="#ef4444" font-weight="600">Unfin.</text>
<text x="1245" y="889" text-anchor="middle" font-size="14" fill="#f1f5f9">2,566</text>

<!-- ===== 重试循环逻辑 ===== -->
<path d="M305,755 L305,790 L240,790 L240,755" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="5,3" fill="none"/>
<text x="270" y="783" font-size="9" fill="#fb923c">~2,000 在重试</text>

<!-- → 重试箭头: Resimulation failed → RetryPool -->
<path d="M130,470 L130,530 L440,530 L440,720" stroke="#fb7185" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#arw-r)"/>
<text x="260" y="540" font-size="9" fill="#fb7185">每轮 95.1% 失败→重试→下一轮再撞锁→循环</text>

<!-- ===== 底部汇总 ===== -->
<rect x="50" y="930" width="600" height="130" rx="6" fill="rgba(30,41,59,0.5)" stroke="#475569" stroke-width="1"/>
<text x="350" y="955" text-anchor="middle" font-size="12" font-weight="600" fill="#f1f5f9">关键结论</text>
<line x1="65" y1="965" x2="635" y2="965" stroke="#475569" stroke-width="0.5"/>
<text x="65" y="985" font-size="10" fill="#fb7185">🔴 95.1% 的 startReSimulation 因 stateDB 锁冲突失败</text>
<text x="65" y="1003" font-size="10" fill="#22d3ee">PatchPool DAG 解决了 372 次 Phase 2b 的匹配，但覆盖率不够</text>
<text x="65" y="1021" font-size="10" fill="#fbbf24">LockWait 832 次 + Phase 1 失败 10,820 次 = 11,652 次回 retry pool</text>
<text x="65" y="1039" font-size="10" fill="#a78bfa">每笔交易平均重试 simNum=2~6，31,502 次失败中大部分是同一批交易的多次重试</text>

<rect x="680" y="930" width="560" height="130" rx="6" fill="rgba(30,41,59,0.5)" stroke="#475569" stroke-width="1"/>
<text x="960" y="955" text-anchor="middle" font-size="12" font-weight="600" fill="#f1f5f9">完整漏斗转化</text>
<line x1="695" y1="965" x2="1225" y2="965" stroke="#475569" stroke-width="0.5"/>
<text x="695" y="983" font-size="10" fill="#94a3b8">HandleRetrySignal → retry commit success: 33,966/44,786 = 75.8%</text>
<text x="695" y="1001" font-size="10" fill="#94a3b8">retry commit success → resimulation success: 1,632/33,134 = 4.9%</text>
<text x="695" y="1019" font-size="10" fill="#94a3b8">BuildSim → close: 13,399/15,052 = 89.0%（跨 shard 多次 close）</text>
<text x="695" y="1037" font-size="10" fill="#94a3b8">总提交率: 7,432 / ~10,000 = 74.3%</text>

</svg>
</body>
</html>
